name = "bgat-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
WORKER_VERSION = "3.0.0"

[[d1_databases]]
binding = "DB"
database_name = "bgat-alerts-db"
database_id = "b38c32c2-6b52-4fa7-bb27-54ed9012d565"

[[d1_databases]]
binding = "WATER_DB"
database_name = "permian-pulse-water"
database_id = "89274454-6dee-4d9f-b2cc-e09a335c42ee"

[[kv_namespaces]]
binding = "CACHE"
id = "c8b0ca4bdf2b4c26829cf406252d5fa2"

[[r2_buckets]]
binding = "R2"
bucket_name = "bgat-media"

[[services]]
binding = "ECHO_CHAT"
service = "echo-chat"

[[services]]
binding = "SHARED_BRAIN"
service = "echo-shared-brain"

[[services]]
binding = "ENGINE_RUNTIME"
service = "echo-engine-runtime"

[triggers]
crons = ["0 */6 * * *"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "echo_metrics"
